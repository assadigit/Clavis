<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Clavis app icon: a simple blue key glyph on the ambient dark-blue tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1F45"/>
      <stop offset="0.6" stop-color="#0B1630"/>
      <stop offset="1" stop-color="#0B1630"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#2F6FEB" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#2F6FEB" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C86F5"/>
      <stop offset="1" stop-color="#2F6FEB"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#glow)"/>
  <!-- key head -->
  <circle cx="128" cy="90" r="40" fill="none" stroke="url(#key)" stroke-width="26"/>
  <!-- key stem -->
  <path d="M116 118 h24 v82 a6 6 0 0 1 -6 6 h-12 a6 6 0 0 1 -6 -6 z" fill="url(#key)"/>
  <!-- key teeth -->
  <path d="M116 148 h-30 a5 5 0 0 0 -5 5 v12 a5 5 0 0 0 5 5 h30 z" fill="url(#key)"/>
  <path d="M116 176 h-20 a5 5 0 0 0 -5 5 v12 a5 5 0 0 0 5 5 h20 z" fill="url(#key)"/>
</svg>
